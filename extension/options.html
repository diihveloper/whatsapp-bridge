<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WhatsApp Bridge Feeder — Settings</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; color: #111; }
    h1 { font-size: 1.1rem; }
    label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; box-sizing: border-box; font-family: monospace; }
    button { margin-top: 1.25rem; padding: .5rem 1rem; cursor: pointer; }
    .hint { color: #666; font-size: .85rem; }
    #status { margin-left: .75rem; color: #137333; }
    code { background: #f1f1f1; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>WhatsApp Bridge Feeder</h1>
  <p class="hint">This extension watches the open WhatsApp Web tab and feeds your local
    <code>whatsapp-bridge</code> service. Keep a WhatsApp Web tab open for it to work.</p>

  <label for="baseUrl">Service URL</label>
  <input id="baseUrl" type="text" placeholder="http://127.0.0.1:4477" />

  <label for="token">API token</label>
  <input id="token" type="text" placeholder="paste apiToken from ~/.whatsapp-bridge/config.json" />
  <p class="hint">Found in <code>~/.whatsapp-bridge/config.json</code> under <code>apiToken</code>.</p>

  <button id="save">Save</button>
  <span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
